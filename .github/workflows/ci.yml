name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://root:password@localhost:5432/auth_db
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://root:password@localhost:5432/auth_db
          REDIS_URL: redis://localhost:6379
      - run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://root:password@localhost:5432/auth_db
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
